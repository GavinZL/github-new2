<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending 数据采集器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
        }

        .control-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .panel-title {
            font-size: 1.5em;
            margin-bottom: 25px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .fetch-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .fetch-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .fetch-button:active {
            transform: translateY(0);
        }

        .fetch-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .project-card {
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            background: white;
        }

        .project-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .project-rank {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .project-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .project-title a {
            color: #0366d6;
            text-decoration: none;
        }

        .project-title a:hover {
            text-decoration: underline;
        }

        .project-desc {
            color: #586069;
            font-size: 0.95em;
            margin: 10px 0;
            line-height: 1.5;
        }

        .project-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #f6f8fa;
            border-radius: 12px;
            font-size: 0.85em;
            color: #586069;
        }

        .language-badge {
            background: #0366d6;
            color: white;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            color: white;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .action-button {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-button:hover {
            background: #667eea;
            color: white;
        }

        .error-message {
            background: #fff0f0;
            border: 1px solid #ff6b6b;
            color: #d63031;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #f0fff4;
            border: 1px solid #48bb78;
            color: #22543d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .control-panel {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 GitHub Trending 数据采集器</h1>
            <p>手动选择参数，动态获取最热门的GitHub项目</p>
        </div>

        <div class="main-content">
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="panel-title">
                    ⚙️ 采集参数设置
                </div>

                <form id="fetchForm">
                    <div class="form-group">
                        <label for="period">📅 时间周期</label>
                        <select id="period" name="period">
                            <option value="daily">今日热门 (Daily)</option>
                            <option value="weekly" selected>本周热门 (Weekly)</option>
                            <option value="monthly">本月热门 (Monthly)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="language">💻 编程语言</label>
                        <select id="language" name="language">
                            {% for lang in languages %}
                            <option value="{{ lang.value }}">{{ lang.label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="limit">📊 项目数量</label>
                        <input type="number" id="limit" name="limit" 
                               value="25" min="5" max="100" step="5">
                    </div>

                    <div class="form-group">
                        <label for="github_token">🔑 GitHub Token (可选)</label>
                        <input type="password" id="github_token" name="github_token" 
                               placeholder="ghp_...">
                        <small style="color: #666; font-size: 0.85em; display: block; margin-top: 5px;">
                            提供Token可获取更多详细信息
                        </small>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="enrich" name="enrich" checked>
                            <label for="enrich" style="margin: 0;">增强数据 (API详情)</label>
                        </div>
                    </div>

                    <button type="submit" class="fetch-button" id="fetchButton">
                        🔍 开始采集
                    </button>
                </form>
            </div>

            <!-- Results Panel -->
            <div class="results-panel">
                <div id="resultsContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <h2>选择参数并点击"开始采集"</h2>
                        <p>我们将为您获取最新的GitHub热门项目</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('fetchForm');
        const fetchButton = document.getElementById('fetchButton');
        const resultsContainer = document.getElementById('resultsContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable button and show loading
            fetchButton.disabled = true;
            fetchButton.textContent = '⏳ 正在采集...';
            
            resultsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <h3>正在获取GitHub Trending数据...</h3>
                    <p>这可能需要几秒钟，请稍候</p>
                </div>
            `;

            try {
                const formData = {
                    period: document.getElementById('period').value,
                    language: document.getElementById('language').value,
                    limit: parseInt(document.getElementById('limit').value),
                    enrich: document.getElementById('enrich').checked,
                    github_token: document.getElementById('github_token').value
                };

                const response = await fetch('/api/fetch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    displayResults(result.data);
                } else {
                    displayError(result.error || '采集失败，请重试');
                }
            } catch (error) {
                displayError('网络错误: ' + error.message);
            } finally {
                fetchButton.disabled = false;
                fetchButton.textContent = '🔍 开始采集';
            }
        });

        function displayResults(data) {
            const { projects, count, period, language, report_file } = data;
            
            const periodText = {
                'daily': '今日',
                'weekly': '本周',
                'monthly': '本月'
            };

            const languageText = language === 'all' ? '全部语言' : language;

            let html = `
                <div class="success-message">
                    ✅ 成功获取 ${count} 个${periodText[period]}热门项目 (${languageText})
                </div>

                <div class="action-buttons">
                    <button class="action-button" onclick="window.open('${report_file}', '_blank')">
                        📊 查看完整报告
                    </button>
                    <button class="action-button" onclick="downloadCSV()">
                        💾 下载CSV数据
                    </button>
                </div>

                <div class="stats-summary">
                    <div class="stat-item">
                        <div class="stat-value">${count}</div>
                        <div class="stat-label">项目总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${countLanguages(projects)}</div>
                        <div class="stat-label">编程语言</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${getTotalStars(projects)}</div>
                        <div class="stat-label">总Star数</div>
                    </div>
                </div>

                <div class="project-grid">
            `;

            projects.forEach((project, index) => {
                html += `
                    <div class="project-card">
                        <div class="project-rank">${index + 1}</div>
                        <div class="project-title">
                            <a href="${project.url}" target="_blank">${project.repository_name}</a>
                        </div>
                        ${project.description ? `<div class="project-desc">${escapeHtml(project.description)}</div>` : ''}
                        <div class="project-meta">
                            ${project.language ? `<span class="meta-badge language-badge">${project.language}</span>` : ''}
                            <span class="meta-badge">⭐ ${formatNumber(project.stars_total)}</span>
                            <span class="meta-badge">📈 +${formatNumber(project.stars_period)}</span>
                            <span class="meta-badge">🍴 ${formatNumber(project.forks)}</span>
                            ${project.open_issues > 0 ? `<span class="meta-badge">❗ ${project.open_issues} issues</span>` : ''}
                        </div>
                        ${project.topics && project.topics.length > 0 ? `
                            <div class="project-meta" style="margin-top: 10px;">
                                ${project.topics.slice(0, 5).map(topic => 
                                    `<span class="meta-badge" style="background: #e8f5e9; color: #2e7d32;">#${topic}</span>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        function displayError(message) {
            resultsContainer.innerHTML = `
                <div class="error-message">
                    ❌ ${escapeHtml(message)}
                </div>
                <div class="empty-state">
                    <div class="empty-state-icon">😢</div>
                    <h2>采集失败</h2>
                    <p>请检查参数设置并重试</p>
                </div>
            `;
        }

        function countLanguages(projects) {
            const languages = new Set(projects.map(p => p.language).filter(l => l));
            return languages.size;
        }

        function getTotalStars(projects) {
            const total = projects.reduce((sum, p) => sum + p.stars_total, 0);
            return formatNumber(total);
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function downloadCSV() {
            alert('CSV文件已保存在 data/raw/ 目录中');
        }
    </script>
</body>
</html>
